<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Na Coco POS</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    background:#ececec;
}

.container{
    display:flex;
    height:100vh;
}

/* Sidebar */

.sidebar{
    width:230px;
    background:#1f2937;
    color:white;
    padding:20px;
}

.logo{
    font-size:28px;
    font-weight:bold;
    margin-bottom:30px;
    color:#ff8a00;
}

.menu{
    padding:14px;
    border-radius:10px;
    margin-bottom:10px;
    cursor:pointer;
}

.menu:hover,
.menu.active{
    background:#374151;
}

/* Main */

.main{
    flex:1;
    padding:20px;
    overflow:auto;
}

.topbar{
    display:flex;
    justify-content:space-between;
    margin-bottom:20px;
}

.search{
    width:300px;
    padding:12px;
    border:none;
    border-radius:10px;
}

.tabs{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

.tab{
    padding:12px 18px;
    border:none;
    border-radius:10px;
    background:white;
    cursor:pointer;
}

.tab.active{
    background:#ff8a00;
    color:white;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
    gap:20px;
}

.card{
    background:white;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 4px 10px rgba(0,0,0,0.08);
    cursor:pointer;
    transition:0.2s;
}

.card:hover{
    transform:translateY(-5px);
}

.card img{
    width:100%;
    height:150px;
    object-fit:cover;
}

.card-body{
    padding:12px;
}

.card-title{
    font-size:18px;
    margin-bottom:8px;
}

.price{
    color:#ff8a00;
    font-weight:bold;
}

/* Cart */

.cart{
    width:360px;
    background:white;
    padding:20px;
    border-left:1px solid #ddd;
    display:flex;
    flex-direction:column;
}

.cart h2{
    margin-bottom:20px;
}

.cart-item{
    border-bottom:1px solid #eee;
    padding-bottom:12px;
    margin-bottom:12px;
}

.cart-top{
    display:flex;
    justify-content:space-between;
    margin-bottom:10px;
}

.qty{
    display:flex;
    align-items:center;
    gap:10px;
}

.qty button{
    width:28px;
    height:28px;
    border:none;
    border-radius:50%;
    background:#ff8a00;
    color:white;
    cursor:pointer;
}

.remove{
    background:red !important;
}

.summary{
    margin-top:auto;
}

.summary div{
    margin-bottom:10px;
}

.pay-btn{
    width:100%;
    padding:16px;
    border:none;
    border-radius:12px;
    background:#ff8a00;
    color:white;
    font-size:18px;
    cursor:pointer;
    margin-top:10px;
}

.payment{
    margin-top:15px;
}

.payment button{
    width:100%;
    padding:12px;
    margin-bottom:10px;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

.cash{
    background:#10b981;
    color:white;
}

.qr{
    background:#3b82f6;
    color:white;
}

.cardpay{
    background:#8b5cf6;
    color:white;
}

</style>
</head>
<body>

<div class="container">

    <!-- Sidebar -->

    <div class="sidebar">

        <div class="logo">🥥 Na Coco</div>

        <div class="menu active">ขายหน้าร้าน</div>
        <div class="menu">จัดการเมนู</div>
        <div class="menu">สต๊อกสินค้า</div>
        <div class="menu">จัดการโต๊ะ</div>
        <div class="menu">พนักงาน</div>
        <div class="menu">รายงาน</div>
        <div class="menu">สมาชิก</div>
        <div class="menu">ตั้งค่าระบบ</div>

    </div>

    <!-- Main -->

    <div class="main">

        <div class="topbar">

            <input 
                type="text" 
                placeholder="ค้นหาเมนู..." 
                class="search"
                id="searchInput"
            >

        </div>

        <div class="tabs">
            <button class="tab active">กาแฟ</button>
            <button class="tab">ชา</button>
            <button class="tab">มะพร้าว</button>
            <button class="tab">เบเกอรี่</button>
        </div>

        <div class="products" id="products"></div>

    </div>

    <!-- Cart -->

    <div class="cart">

        <h2>ออเดอร์</h2>

        <div id="cartItems"></div>

        <div class="summary">

            <div>
                ลูกค้า: สมาชิกทั่วไป
            </div>

            <div>
                VAT 7%
            </div>

            <h2>
                รวม: <span id="totalPrice">0</span> บาท
            </h2>

            <div class="payment">

                <button class="cash">
                    เงินสด
                </button>

                <button class="qr">
                    PromptPay QR
                </button>

                <button class="cardpay">
                    บัตรเครดิต
                </button>

            </div>

            <button class="pay-btn">
                ชำระเงิน
            </button>

        </div>

    </div>

</div>

<script>

/* สินค้า */

const products = [

{
    id:1,
    name:"Americano",
    price:65,
    stock:20,
    image:"https://images.unsplash.com/photo-1509042239860-f550ce710b93?q=80&w=800"
},

{
    id:2,
    name:"Latte",
    price:75,
    stock:15,
    image:"https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?q=80&w=800"
},

{
    id:3,
    name:"Coconut Coffee",
    price:89,
    stock:10,
    image:"https://images.unsplash.com/photo-1517701550927-30cf4ba1fcef?q=80&w=800"
},

{
    id:4,
    name:"Croissant",
    price:55,
    stock:30,
    image:"https://images.unsplash.com/photo-1555507036-ab1f4038808a?q=80&w=800"
}

];

/* ตัวแปร */

let cart = [];

let paymentMethod = "เงินสด";

const productsEl = document.getElementById("products");
const cartItems = document.getElementById("cartItems");
const totalPrice = document.getElementById("totalPrice");
const searchInput = document.getElementById("searchInput");

/* เลือกวิธีจ่ายเงิน */

document.querySelector(".cash").onclick = ()=>{

    paymentMethod = "เงินสด";

    alert("เลือกชำระ: เงินสด");

}

document.querySelector(".qr").onclick = ()=>{

    paymentMethod = "QR PromptPay";

    alert("เลือกชำระ: QR PromptPay");

}

document.querySelector(".cardpay").onclick = ()=>{

    paymentMethod = "บัตรเครดิต";

    alert("เลือกชำระ: บัตรเครดิต");

}

/* แสดงสินค้า */

function renderProducts(list){

    productsEl.innerHTML = "";

    list.forEach(product=>{

        const card = document.createElement("div");

        card.className = "card";

        card.innerHTML = `
        
            <img src="${product.image}">
            
            <div class="card-body">

                <div class="card-title">
                    ${product.name}
                </div>

                <div class="price">
                    ${product.price} บาท
                </div>

                <small>
                    คงเหลือ ${product.stock}
                </small>

            </div>
        
        `;

        card.onclick = ()=> addToCart(product);

        productsEl.appendChild(card);

    });

}

/* เพิ่มสินค้า */

function addToCart(product){

    const existing = cart.find(item=> item.id === product.id);

    if(existing){

        existing.qty++;

    }else{

        cart.push({
            ...product,
            qty:1
        });

    }

    renderCart();

}

/* แสดงตะกร้า */

function renderCart(){

    cartItems.innerHTML = "";

    let total = 0;

    cart.forEach(item=>{

        total += item.price * item.qty;

        const div = document.createElement("div");

        div.className = "cart-item";

        div.innerHTML = `
        
            <div class="cart-top">

                <div>
                    <b>${item.name}</b>
                    <br>
                    ${item.price} บาท
                </div>

                <button 
                    class="remove"
                    onclick="removeItem(${item.id})"
                >
                    X
                </button>

            </div>

            <div class="qty">

                <button onclick="decreaseQty(${item.id})">
                    -
                </button>

                <span>${item.qty}</span>

                <button onclick="increaseQty(${item.id})">
                    +
                </button>

            </div>
        
        `;

        cartItems.appendChild(div);

    });

    const vat = total * 0.07;

    totalPrice.innerText = (total + vat).toFixed(2);

}

/* เพิ่มจำนวน */

function increaseQty(id){

    const item = cart.find(i=> i.id === id);

    item.qty++;

    renderCart();

}

/* ลดจำนวน */

function decreaseQty(id){

    const item = cart.find(i=> i.id === id);

    if(item.qty > 1){

        item.qty--;

    }

    renderCart();

}

/* ลบสินค้า */

function removeItem(id){

    cart = cart.filter(item=> item.id !== id);

    renderCart();

}

/* ค้นหา */

searchInput.addEventListener("keyup",(e)=>{

    const keyword = e.target.value.toLowerCase();

    const filtered = products.filter(product=>

        product.name.toLowerCase().includes(keyword)

    );

    renderProducts(filtered);

});

/* ส่งข้อมูลเข้า Google Sheets */

async function sendToSheet(){

    if(cart.length === 0){

        alert("ยังไม่มีออเดอร์");

        return;

    }

    let total = 0;

    let menuList = "";

    cart.forEach(item=>{

        total += item.price * item.qty;

        menuList += `${item.name} x${item.qty}, `;

    });

    const vat = total * 0.07;

    const finalTotal = (total + vat).toFixed(2);

    const data = {

        menu: menuList,

        qty: cart.length,

        total: finalTotal,

        payment: paymentMethod

    };

    try{

        await fetch("PASTE_YOUR_GOOGLE_SCRIPT_URL_HERE",{

            method:"POST",

            body:JSON.stringify(data)

        });

        alert("ชำระเงินสำเร็จ");

        cart = [];

        renderCart();

    }catch(error){

        alert("ส่งข้อมูลไม่สำเร็จ");

        console.log(error);

    }

}

/* ปุ่มชำระเงิน */

document.querySelector(".pay-btn").onclick = ()=>{

    sendToSheet();

}

/* เริ่มต้น */

renderProducts(products);

</script>

</body>
</html>
